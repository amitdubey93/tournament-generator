<script>
    window.onload = function () {

    <!--    var $td =  $('td', this);-->
    <!--        return {-->
    <!--                 x: new Date($td.eq(0).text()),-->
    <!--                 y: parseInt($td.eq(1).text())-->
    <!--               }-->
    <!--        }).get();-->


        var dataPoints = [];
        var pieChartDataPoints = [];
        var matchData = JSON.parse($('#dailyFreePlayMatchCounts').html());
        var pieChartData = JSON.parse($('#playerActivity').html());

        var options = {
            animationEnabled: true,
            title:{
                text: "Daily FreePlay MatchCount"
            },
            axisX: {
                valueFormatString: "DD MMM"
            },
            axisY: {
                title: "Match Count"
            },
            data: [{
                type: "spline",
                dataPoints: dataPoints
            }]
        };

        var pieChartOptions = {
            title: {
                text: "Player's Overall Activity"
            },
            subtitles: [{
                text: "shown in below pie chart"
            }],
            theme: "light2",
            animationEnabled: true,
            data: [{
                type: "pie",
                startAngle: 40,
                toolTipContent: "<b>{label}</b>: {y}%",
                showInLegend: "true",
                legendText: "{label}",
                indexLabelFontSize: 16,
                indexLabel: "{label} - {y}%",
                dataPoints: pieChartDataPoints
            }]
        };


        for (var i = 0; i < matchData.length; i++) {
            dataPoints.push({
                x: new Date(matchData[i].matchDate),
                y: matchData[i].matchCount
            });
        }
        for (var i = 0; i < pieChartData.length; i++) {
            pieChartDataPoints.push({
                y: pieChartData[i].matchPlayedPercent,
                label: pieChartData[i].playerName
            });
        }
        console.log(matchData);
        console.log(dataPoints);
        console.log(pieChartData);
        console.log(pieChartOptions);
        $("#chartContainer").CanvasJSChart(options);
        $("#pieChartContainer").CanvasJSChart(pieChartOptions);

    }
</script>
