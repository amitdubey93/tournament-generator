<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Player Info</title>

</head>
<body>
<!--<div th:replace="fragments/head_script :: head_script">...</div>-->
<div th:replace="~{fragments/header :: header}">...</div>
<div class="container my-5">

    <h3>Player Info</h3>
    <div class="row" id="player-info">
        <!--        <div class="col-3"><img class="img-circle1" th:src="${playerStat.imagePath}"/></div>-->
        <!--        <div class="col-9">-->
        <!--            <div>Name: <span th:text="${playerStat.playerName}"></span></div>-->
        <!--            <div>Match Played: <span th:text="${playerStat.matchPlayed}"></span></div>-->
        <!--            <div>Score: <span th:text="${playerStat.score}"></span></div>-->
        <!--            <div>Total Wins: <span th:text="${playerStat.totalWins}"></span></div>-->
        <!--            <div>Win %: <span th:text="${playerStat.winPercent}"></span></div>-->
        <!--            <div>Avg. Score: <span th:text="${playerStat.avgScore}"></span></div>-->
        <!--        </div>-->
        <table class="table table-striped table-responsive" id="table-player-info">
            <thead>
            <tr>
                <!--                    <th>Name</th>-->
                <th>Game Type</th>
                <th>Match Played</th>
                <th>Score</th>
                <th>Opp. Score</th>
                <th>Wins</th>
                <th>Win %</th>
                <th>Avg. Score</th>
                <th>Opp Avg. Score</th>
                <th>Score Margin %</th>
            </tr>
            </thead>
            <tbody>
            <!--                <tr>-->
            <!--                    <td th:text="${playerStat.playerName}"></td>-->
            <!--&lt;!&ndash;                    <td th:text="${playerStat.gameType}"></td>&ndash;&gt;-->
            <!--                    <td>F10 - First 10 wins</td>-->
            <!--                    <td th:text="${playerStat.matchPlayed}"></td>-->
            <!--                    <td th:text="${playerStat.score}"></td>-->
            <!--                    <td th:text="${playerStat.oppScore}"></td>-->
            <!--                    <td th:text="${playerStat.totalWins}"></td>-->
            <!--                    <td th:text="${playerStat.winPercent}"></td>-->
            <!--                    <td th:text="${playerStat.avgScore}"></td>-->
            <!--                    <td th:text="${playerStat.oppAvgScore}"></td>-->
            <!--                    <td th:text="${playerStat.scoreMargin}"></td>-->
            <!--                </tr>-->
            <tr th:each="playerStatDTO:${playerStatsByGameType}">
                <!--                    <td>-->
                <!--                        <a class="btn btn-link" th:href="@{/player/{id}(id=${player.playerId})}"-->
                <!--                           th:text="${playerStatDTO.playerName}"></a>-->
                <!--                    </td>-->
                <!--                    <td th:text="${playerStatDTO.playerName}"></td>-->
                <td style="font-weight:bold" th:text="${playerStatDTO.gameTypeName}"></td>
                <td th:text="${playerStatDTO.matchPlayed}"></td>
                <td th:text="${playerStatDTO.score}"></td>
                <td th:text="${playerStatDTO.oppScore}"></td>
                <td th:text="${playerStatDTO.totalWins}"></td>
                <td th:text="${playerStatDTO.winPercent}"></td>
                <!--                    <td th:text="${playerStatDTO.totalLost}"></td>-->
                <td th:text="${playerStatDTO.avgScore}"></td>
                <td th:text="${playerStatDTO.oppAvgScore}"></td>
                <td th:text="${playerStatDTO.scoreMargin}"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="row" id="pvp-stat-list">
        <div class="tab-header" id="tab-header">
            <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist" style="width:100%">
                <li class="nav-item mr-2" role="presentation" th:each="pvpStat:${pvpCompleteStat}">
                    <button aria-selected="false" class="nav-link" data-toggle="pill"
                            role="tab" th:aria-controls="${pvpStat.playerName}"
                            th:data-target="'#'+${pvpStat.playerName}" th:id="${pvpStat.playerId}+'-tab'" type="button">
                        <b>vs&nbsp;</b><span th:text="${pvpStat.playerName}"></span>
                    </button>
                </li>
            </ul>
        </div>
        <div class="tab-content" id="pills-tabContent">
            <div class="tab-pane fade" role="tabpanel" th:aria-labelledby="${pvpStat.playerId}+'-tab'"
                 th:each="pvpStat:${pvpCompleteStat}" th:id="${pvpStat.playerName}">
                <div class="player-content">
                    <div class="row">
                        <div class="tab-header" id="inner-tab-header" th:if="${pvpStat.pvpStatsByGameTypeList}">
                            <ul class="nav nav-pills mb-3 pillstab" role="tablist"
                                style="width:100%" th:id="'inner-pills-tab'+${pvpStat.playerId}">
                                <li class="nav-item mr-2" role="presentation"
                                    th:each="pvpStatByGameType:${pvpStat.pvpStatsByGameTypeList}">
                                    <button aria-selected="false"
                                            class="nav-link"
                                            data-toggle="pill"
                                            role="tab"
                                            th:aria-controls="${pvpStatByGameType.gameType}+${pvpStatByGameType.playerOneName}+${pvpStatByGameType.playerTwoName}"
                                            th:data-target="'#'+${pvpStatByGameType.gameType}+${pvpStatByGameType.playerOneName}+${pvpStatByGameType.playerTwoName}" th:id="${pvpStatByGameType.gameType}+'-inner-tab-'+${pvpStatByGameType.playerTwoName}" type="button">
                                        <span th:text="${pvpStatByGameType.gameTypeName}"></span>
                                    </button>
                                </li>
                            </ul>
                        </div>
                        <div class="tab-content tabcontent" th:id="'inner-pills-tabContent'+${pvpStat.playerId}"
                             th:if="${pvpStat.pvpStatsByGameTypeList}">
                            <div class="tab-pane fade" role="tabpanel"
                                 th:aria-labelledby="${pvpStatByGameType.gameType}+'-inner-tab-'+${pvpStatByGameType.playerTwoName}"
                                 th:each="pvpStatByGameType:${pvpStat.pvpStatsByGameTypeList}"
                                 th:id="${pvpStatByGameType.gameType}+${pvpStatByGameType.playerOneName}+${pvpStatByGameType.playerTwoName}">
                                <div class="row" id="">
                                    <table class="table table-striped table-responsive" style="text-align:center">
                                        <tbody>
                                        <tr>
                                            <td rowspan="5" th:text="${pvpStatByGameType.gameTypeName}"></td>
                                        </tr>
                                        <tr>
                                            <td rowspan="4"><img class="img-circle1"
                                                                 th:src="${pvpStatByGameType.playerOneImagePath}"/></td>
                                            <td th:text="${pvpStatByGameType.playerOneScore}"></td>
                                            <td><b>Score</b></td>
                                            <td th:text="${pvpStatByGameType.playerTwoScore}"></td>
                                            <td rowspan="4"><img class="img-circle1"
                                                                 th:src="${pvpStatByGameType.playerTwoImagePath}"/></td>
                                        </tr>
                                        <tr>
                                            <td th:text="${pvpStatByGameType.playerOneWins}"></td>
                                            <td><b>Wins</b></td>
                                            <td th:text="${pvpStatByGameType.playerTwoWins}"></td>
                                        </tr>
                                        <tr>
                                            <td th:text="${pvpStatByGameType.playerOneWinPercent}"></td>
                                            <td><b>Win %</b></td>
                                            <td th:text="${pvpStatByGameType.playerTwoWinPercent}"></td>
                                        </tr>
                                        <tr>
                                            <td th:text="${pvpStatByGameType.playerOneAvgScore}"></td>
                                            <td><b>Avg. Score</b></td>
                                            <td th:text="${pvpStatByGameType.playerTwoAvgScore}"></td>
                                        </tr>
                                        <tr>
                                            <td th:text="${pvpStatByGameType.playerOneName}"></td>
                                            <td colspan="3"><b>VS</b></td>
                                            <td><a class="btn btn-link"
                                                   th:href="@{/player/{id}(id=${pvpStatByGameType.playerTwoId})}"
                                                   th:text="${pvpStatByGameType.playerTwoName}"></a>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td colspan="5">Winning Player: <b><span
                                                    th:text="${pvpStatByGameType.winningPlayerName}"></span></b>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td colspan="5">Winning Score Margin :: <b><span
                                                    th:text="${pvpStatByGameType.scoreMargin}+' %'"></span></b></td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <table class="table-pvp-fpml table table-striped table-responsive">
                            <thead>
                            <tr>
                                <th>Match Id</th>
                                <th>Game Type</th>
                                <th>Player One</th>
                                <th>Player Two</th>
                                <th>Player One Score</th>
                                <th>Player Two Score</th>
                                <th>Winner</th>
                                <th>Match Time</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="match:${pvpStat.freePlayMatchList}">
                                <td th:text="${match.freePlayId}"></td>
                                <td th:text="${match.gameType}"></td>
                                <td th:text="${match.playerOneName}"></td>
                                <td th:text="${match.playerTwoName}"></td>
                                <td th:text="${match.playerOneScore}"></td>
                                <td th:text="${match.playerTwoScore}"></td>
                                <td th:text="${match.winnerName}"></td>
                                <!--                                <td th:text="${match.matchTime}"></td>-->
                                <td th:text="${#dates.format(match.matchTime, 'dd-MMM-yyyy HH:mm')}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>


</div>

</script>
</body>
